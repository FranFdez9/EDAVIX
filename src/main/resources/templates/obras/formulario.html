<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Formulario de obra</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f6f8; color: #212529; }
        nav { background-color: #212529; color: white; padding: 16px 0; }
        .contenedor { width: 90%; max-width: 850px; margin: auto; }
        .navbar { display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; }
        .marca { font-size: 20px; font-weight: bold; }
        .navegacion { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; }
        .navegacion a { font-size: 14px; }
        .navegacion a:hover { color: #adb5bd; }
        main { padding-top: 45px; padding-bottom: 40px; }
        h1 { font-size: 28px; margin-bottom: 8px; }
        .descripcion { color: #6c757d; margin-bottom: 25px; }
        .formulario-contenedor { background-color: white; padding: 30px; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
        .campo { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; }
        input, textarea { width: 100%; padding: 11px; border: 1px solid #ced4da; border-radius: 5px; font-size: 14px; font-family: Arial, sans-serif; }
        textarea { resize: vertical; min-height: 100px; }
        input:focus, textarea:focus { outline: none; border-color: #86b7fe; box-shadow: 0 0 0 3px rgba(13,110,253,.15); }
        .error { color: #dc3545; font-size: 13px; margin-top: 6px; }
        .acciones { display: flex; gap: 10px; margin-top: 25px; }
        .boton { display: inline-block; padding: 11px 17px; border-radius: 5px; text-decoration: none; font-size: 14px; cursor: pointer; border: 1px solid; }
        .boton-guardar { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        .boton-cancelar { background-color: white; color: #6c757d; border-color: #6c757d; }
        .boton:hover { opacity: .85; }
        @media (max-width: 700px) {
            .navbar { gap: 15px; flex-wrap: wrap; }
            .navegacion { gap: 15px; }
        }
    </style>
</head>
<body>
<nav>
    <div class="contenedor navbar">
        <a class="marca" th:href="@{/avisos}" th:text="#{app.nombre}">EDAVIX</a>
        <div class="navegacion">
            <a th:href="@{/avisos}" th:text="#{nav.avisos}">Gestión de avisos</a>
            <a th:href="@{/obras}" th:text="#{nav.obras}">Gestión de obras</a>
            <span>
                <a th:href="@{/obras/nueva(lang='es')}" th:text="#{idioma.es}">ES</a>
                |
                <a th:href="@{/obras/nueva(lang='en')}" th:text="#{idioma.en}">EN</a>
            </span>
        </div>
    </div>
</nav>

<main class="contenedor">
    <h1 th:text="${titulo}">Formulario de obra</h1>
    <p class="descripcion" th:text="#{obra.formularioDescripcion}">
        Introduce los datos correspondientes a la obra.
    </p>

    <div class="formulario-contenedor">
        <form th:action="${accion}" th:object="${obra}" method="post">
            <input type="hidden" th:field="*{idObra}">

            <div class="campo">
                <label for="nombre" th:text="#{obra.nombreLabel}">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}">
                <p class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>

            <div class="campo">
                <label for="direccion" th:text="#{obra.direccionLabel}">Dirección:</label>
                <input type="text" id="direccion" th:field="*{direccion}">
                <p class="error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></p>
            </div>

            <div class="campo">
                <label for="descripcion" th:text="#{obra.descripcionCampo}">Descripción:</label>
                <textarea id="descripcion" th:field="*{descripcion}"></textarea>
                <p class="error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></p>
            </div>

            <div class="campo">
                <label for="fechaInicio" th:text="#{obra.fechaInicioLabel}">Fecha de inicio:</label>
                <input type="date" id="fechaInicio" th:field="*{fechaInicio}">
                <p class="error" th:if="${#fields.hasErrors('fechaInicio')}" th:errors="*{fechaInicio}"></p>
            </div>

            <div class="campo">
                <label for="fechaFin" th:text="#{obra.fechaFinLabel}">Fecha de fin:</label>
                <input type="date" id="fechaFin" th:field="*{fechaFin}">
            </div>

            <div class="campo">
                <label for="estado" th:text="#{obra.estadoLabel}">Estado:</label>
                <input type="text" id="estado" th:field="*{estado}">
                <p class="error" th:if="${#fields.hasErrors('estado')}" th:errors="*{estado}"></p>
            </div>

            <div class="acciones">
                <button type="submit" class="boton boton-guardar" th:text="#{obra.guardar}">Guardar</button>
                <a th:href="@{/obras}" class="boton boton-cancelar" th:text="#{obra.cancelar}">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
