
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{aviso.titulo}">Listado de avisos</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f5f6f8; color: #212529; }
        nav { background-color: #212529; color: white; padding: 16px 0; }
        .contenedor { width: 90%; max-width: 1200px; margin: auto; }
        .navbar { display: flex; justify-content: space-between; align-items: center; }
        .navbar a { color: white; text-decoration: none; }
        .marca { font-size: 20px; font-weight: bold; }
        .navegacion { display: flex; align-items: center; gap: 25px; flex-wrap: wrap; }
        .navegacion a { font-size: 14px; }
        .navegacion a:hover { color: #adb5bd; }
        main { padding-top: 45px; padding-bottom: 40px; }
        .cabecera { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { margin: 0 0 8px; font-size: 28px; }
        .descripcion { color: #6c757d; margin: 0; }
        .boton { display: inline-block; padding: 9px 14px; border-radius: 5px; text-decoration: none; font-size: 14px; cursor: pointer; border: 1px solid; }
        .boton-nuevo { background-color: #0d6efd; color: white; border-color: #0d6efd; }
        .boton-editar { background-color: white; color: #0d6efd; border-color: #0d6efd; }
        .boton-eliminar { background-color: white; color: #dc3545; border-color: #dc3545; }
        .boton:hover { opacity: 0.8; }
        .tabla-contenedor { background-color: white; border-radius: 5px; overflow-x: auto; box-shadow: 0 2px 5px rgba(0,0,0,.08); }
        table { width: 100%; border-collapse: collapse; background-color: white; }
        thead { background-color: #212529; color: white; }
        th, td { padding: 13px 14px; text-align: left; border-bottom: 1px solid #dee2e6; font-size: 14px; }
        th { font-weight: bold; }
        tbody tr:hover { background-color: #f8f9fa; }
        .acciones { display: flex; gap: 7px; align-items: center; }
        .acciones form { margin: 0; }
        .estado { display: inline-block; padding: 4px 8px; border-radius: 5px; font-size: 12px; font-weight: bold; }
        .leido { background-color: #198754; color: white; }
        .pendiente { background-color: #ffc107; color: #212529; }
        .vacio { text-align: center; padding: 30px; color: #6c757d; }
        @media (max-width: 700px) {
            .cabecera { align-items: flex-start; gap: 15px; flex-direction: column; }
            .navbar { gap: 15px; flex-wrap: wrap; }
            .navegacion { gap: 15px; }
        }
    </style>
</head>
<body>
<nav>
    <div class="contenedor navbar">
        <a class="marca" th:href="@{/avisos}" th:text="#{app.nombre}">EDAVIX</a>
        <div class="navegacion">
            <a th:href="@{/avisos}" th:text="#{nav.avisos}">Gestión de avisos</a>
            <a th:href="@{/obras}" th:text="#{nav.obras}">Gestión de obras</a>
            <span>
                <a th:href="@{/avisos(lang='es')}" th:text="#{idioma.es}">ES</a>
                |
                <a th:href="@{/avisos(lang='en')}" th:text="#{idioma.en}">EN</a>
            </span>
        </div>
    </div>
</nav>

<main class="contenedor">
    <div class="cabecera">
        <div>
            <h1 th:text="#{aviso.titulo}">Listado de avisos</h1>
            <p class="descripcion" th:text="#{aviso.descripcion}">Consulta y administra los avisos de las obras.</p>
        </div>
        <a class="boton boton-nuevo" th:href="@{/avisos/nuevo}">
            + <span th:text="#{aviso.nuevo}">Nuevo aviso</span>
        </a>
    </div>

    <div class="tabla-contenedor">
        <table>
            <thead>
            <tr>
                <th th:text="#{aviso.id}">ID</th>
                <th th:text="#{aviso.tipo}">Tipo</th>
                <th th:text="#{aviso.mensaje}">Mensaje</th>
                <th th:text="#{aviso.fecha}">Fecha</th>
                <th th:text="#{aviso.estado}">Estado</th>
                <th th:text="#{aviso.obra}">Obra</th>
                <th th:text="#{aviso.acciones}">Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="aviso : ${avisos}">
                <td th:text="${aviso.idAviso}"></td>
                <td><strong th:text="${aviso.tipo}"></strong></td>
                <td th:text="${aviso.mensaje}"></td>
                <td th:text="${aviso.fecha}"></td>
                <td>
                    <span th:if="${aviso.leido}" class="estado leido" th:text="#{aviso.leido}">Leído</span>
                    <span th:unless="${aviso.leido}" class="estado pendiente" th:text="#{aviso.pendiente}">Pendiente</span>
                </td>
                <td th:text="'Obra #' + ${aviso.idObra}"></td>
                <td>
                    <div class="acciones">
                        <a class="boton boton-editar"
                           th:href="@{/avisos/{id}/editar(id=${aviso.idAviso})}"
                           th:text="#{aviso.editar}">Editar</a>

                        <form th:action="@{/avisos/{id}/eliminar(id=${aviso.idAviso})}"
                              method="post"
                              th:attr="data-confirm=#{aviso.confirmarEliminar}"
                              onsubmit="return confirm(this.dataset.confirm)">

                            <button type="submit"
                                    class="boton boton-eliminar"
                                    th:text="#{aviso.eliminar}">
                                Eliminar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(avisos)}">
                <td colspan="7" class="vacio" th:text="#{aviso.vacio}">No hay avisos registrados.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
